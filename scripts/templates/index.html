<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Machine Translation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #translation {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>English-to-French Translator</h1>
        <form id="translationForm">
            <textarea id="inputText" placeholder="Enter text to translate..." required></textarea><br>
            <button type="submit">Translate</button>
        </form>
        <div id="translation"></div>
    </div>
    <script>
        document.getElementById("translationForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            const text = document.getElementById("inputText").value;
            const response = await fetch("/translate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: new URLSearchParams({ text: text }),
            });
            const result = await response.json();
            if (response.ok) {
                document.getElementById("translation").innerText = `Translation: ${result.translation}`;
            } else {
                document.getElementById("translation").innerText = `Error: ${result.error}`;
            }
        });
    </script>
</body>
</html>
